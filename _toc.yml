# ============================================================
# Table des matières — Python pour physiciens
# Format JupyterBook (_toc.yml)
# ============================================================

format: jb-book
root: intro

parts:

  # ──────────────────────────────────────────────
  # PARTIE 0 : INTRODUCTION
  # ──────────────────────────────────────────────
  - caption: "Avant-propos"
    numbered: false
    chapters:
      - file: avant-propos/pourquoi-python
        title: "Pourquoi Python en physique ?"
      - file: avant-propos/installation
        title: "Installation et configuration"
      - file: avant-propos/guide-lecture
        title: "Guide de lecture"

  # ──────────────────────────────────────────────
  # PARTIE 1 : CALCUL NUMÉRIQUE
  # ──────────────────────────────────────────────
  - caption: "Rubrique 1 — Calcul numérique et simulation"
    numbered: true
    chapters:
      - file: notebooks/r01/01_introduction
        title: "Introduction et positionnement"
      - file: notebooks/r01/02_numpy_fondements
        title: "NumPy — Fondements"
        sections:
          - file: notebooks/r01/02a_ndarray
            title: "Le tableau N-dimensionnel"
          - file: notebooks/r01/02b_vectorisation
            title: "Vectorisation et broadcasting"
          - file: notebooks/r01/02c_linalg
            title: "Algèbre linéaire"
      - file: notebooks/r01/03_scipy_solveurs
        title: "SciPy — Solveurs physiques"
        sections:
          - file: notebooks/r01/03a_ode
            title: "Équations différentielles ordinaires"
          - file: notebooks/r01/03b_integration
            title: "Intégration numérique"
          - file: notebooks/r01/03c_sparse
            title: "Algèbre creuse"
      - file: notebooks/r01/04_monte_carlo
        title: "Simulation Monte-Carlo — Modèle d'Ising"
      - file: notebooks/r01/05_limites
        title: "Limites et bonnes pratiques"
      - file: exercices/r01/exercices
        title: "Exercices"

  # ──────────────────────────────────────────────
  # PARTIE 2 : CALCUL SYMBOLIQUE
  # ──────────────────────────────────────────────
  - caption: "Rubrique 2 — Calcul symbolique"
    numbered: true
    chapters:
      - file: notebooks/r02/01_introduction
        title: "Introduction — SymPy"
      - file: notebooks/r02/02_mecanique_quantique
        title: "Mécanique quantique — Opérateurs"
      - file: notebooks/r02/03_lagrange
        title: "Mécanique analytique — Lagrange"
      - file: notebooks/r02/04_perturbations
        title: "Théorie des perturbations"
      - file: notebooks/r02/05_relativite
        title: "Relativité générale — Tenseurs"
      - file: notebooks/r02/06_flux_symbo_num
        title: "Flux symbolique → numérique"
      - file: exercices/r02/exercices
        title: "Exercices"

  # ──────────────────────────────────────────────
  # PARTIE 3 : TRAITEMENT DE DONNÉES
  # ──────────────────────────────────────────────
  - caption: "Rubrique 3 — Traitement et analyse de données"
    numbered: true
    chapters:
      - file: notebooks/r03/01_introduction
        title: "Introduction — Pipeline expérimental"
      - file: notebooks/r03/02_nettoyage
        title: "Nettoyage et structuration"
      - file: notebooks/r03/03_spectroscopie
        title: "Ajustement de raies spectrales"
      - file: notebooks/r03/04_fourier
